<title>側転の動き</title>

<style>

:root{
  --bg:#eef3f6; --fg:#1d2a33; --muted:#5b6b76; --panel:#ffffff; --line:#d3dde4;
  --stage:#dfe8ee; --accent:#e0761c; --accent-fg:#ffffff;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141b20; --fg:#e6edf2; --muted:#9aabb6; --panel:#1d262d; --line:#2f3c46;
  --stage:#22303a; --accent:#f08a3a; --accent-fg:#141b20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141b20; --fg:#e6edf2; --muted:#9aabb6; --panel:#1d262d; --line:#2f3c46;
  --stage:#22303a; --accent:#f08a3a; --accent-fg:#141b20; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:1.25rem;margin:0}
.stage{position:relative;width:100%;aspect-ratio:16/10;max-height:58vh;border-radius:12px;overflow:hidden;background:var(--stage);touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.phase{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:4.2em}
.phase h2{margin:0 0 2px;font-size:1.15rem}
.phase p{margin:0;font-size:1rem;line-height:1.6}
.bar{display:flex;gap:8px;align-items:center}
.bar input[type=range]{flex:1;min-width:0;height:48px;accent-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.label{font-size:.8rem;color:var(--muted);width:100%;margin:0}
button{font:inherit;font-weight:700;min-height:48px;padding:0 16px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

#play{min-width:96px}
.note{font-size:.78rem;color:var(--muted);margin:0;line-height:1.6}
</style>
<div class="wrap">
  <h1>側転の動き</h1>
  <div class="stage" id="stage"></div>
  <div class="phase" aria-live="polite"><h2 id="phName">構え</h2><p id="phTip"></p></div>
  <div class="bar"><button id="play">▶ 再生</button><input type="range" id="seek" min="0" max="1000" value="0" aria-label="再生位置"></div>
  <div class="row" id="speeds"><p class="label">速さ</p></div>
  <div class="row" id="phases"><p class="label">局面へとぶ</p></div>
  <div class="row" id="zooms"><p class="label">大きさ（2本指でつまんでも変えられます）</p></div>
  <div class="row" id="skins"><p class="label">見た目</p></div>
  <div class="row" id="fpv"><p class="label">本人の目線（どんな景色が見えるか）</p></div>
  <div class="row" id="views"><p class="label">見る向き（指でドラッグしても回せます）</p></div>
  <p class="note">人形は人体寸法の実測比から作った中間案（約6頭身）。時間配分と姿勢は、手本動画（トントン拍子「きれいに回る！側転のコツ」）のコマから写したもの。動画の途中の静止画面の時間は詰めています。見えない側の手足と足首は前後の姿勢から推定しています。</p>
</div>

(function(){

const stage=document.getElementById('stage');

stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();

const sun=new THREE.DirectionalLight(0xffffff,0.6); sun.position.set(2,4,3); scene.add(sun);
const cam=new THREE.PerspectiveCamera(30,1.6,0.1,50);

// 2関節の逆運動学（親の座標で目標Tとひざ・ひじの向きPを与える）。sign=-1:ひじ（前に曲がる） +1:ひざ（後ろに曲がる）
function solve2(j1,j2,T,P,A,B,sign){
  const S=j1.position.clone();
  const d=T.clone().sub(S); const R=(A+B), raw=d.length(), k0=0.99*R, sp=0.0095*R; // 伸びきる手前でやわらかく止める（ひじ・ひざの急な振れを防ぐ）
  const len=raw<k0?raw:k0+sp*(1-Math.exp(-(raw-k0)/sp)); d.setLength(Math.max(len,Math.abs(A-B)*1.01));
  const l=d.length(), dirT=d.clone().normalize();

  const pole=P.clone().sub(dirT.clone().multiplyScalar(P.dot(dirT))).normalize();
  const dirU=dirT.clone().multiplyScalar(Math.cos(a)).add(pole.clone().multiplyScalar(Math.sin(a))).normalize();
  const E=S.clone().add(dirU.clone().multiplyScalar(A));

  const Y=dirU.clone().negate();
  let Z=dirF.clone().sub(dirU.clone().multiplyScalar(dirF.dot(dirU)));

  j1.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(X,Y,Z));

const tmpQ=new THREE.Quaternion();
function setWorldQuat(obj,q){obj.parent.updateMatrixWorld(true);obj.parent.getWorldQuaternion(tmpQ);obj.quaternion.copy(tmpQ.invert().multiply(q));}

  const Y=f.clone().normalize().negate(); let Z=n.clone().sub(Y.clone().multiplyScalar(n.dot(Y))).normalize();
  const X=new THREE.Vector3().crossVectors(Y,Z).normalize();
  return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(X,Y,Z));

const FLOOR=0.02; // マットの厚さ

// ---- 動きのデータ（秒。手本動画1:28〜の側転のコマから時間配分を読み取り。途中の静止画面ぶんは詰めた） ----
// 体の向き：yaw=左右の向き（90で進む方向を向く、0でカメラを向く）, pitch=前傾, roll=側転の回転（負で進む方向へ倒れる）
const TR={
 pel:[ // 骨盤の位置 [x(進む方向), 高さ, z]
  [0,[0,.84,0]],[.30,[.02,.84,0]],[.42,[.25,.78,0]],[.55,[.48,.64,0]],[.66,[.76,.64,0]],[.82,[1.05,.80,0]],[1.00,[1.35,.95,0]],
  [1.18,[1.62,.88,0]],[1.36,[1.90,.80,0]],[1.55,[1.96,.72,0]],[1.75,[2.0,.69,0]],[2.0,[2.18,.73,0]],[2.25,[2.31,.79,0]],[2.5,[2.33,.83,0]],[3.2,[2.33,.83,0]]],
 ori:[ // [yaw, pitch, roll]
  [0,[90,0,0]],[.30,[90,0,0]],[.42,[88,12,0]],[.55,[75,35,-10]],[.66,[45,30,-55]],[.82,[12,8,-125]],[1.00,[0,0,-180]],
  [1.18,[0,0,-225]],[1.36,[0,0,-268]],[1.55,[0,0,-276]],[1.75,[0,0,-286]],[2.0,[0,0,-318]],[2.25,[0,0,-346]],[2.5,[0,0,-360]],[3.2,[0,0,-360]]],
 pelK:[[0,[1]],[.35,[1]],[.50,[.72]],[.62,[.68]],[.78,[.75]],[.95,[1]],[3.2,[1]]], // 骨盤が胴の回転についていく割合
 bend:[ // [腹, 胸, 首] の前後の曲げ（度）
  [0,[0,0,0]],[.42,[2,1,-6]],[.60,[2,1,-8]],[.82,[1,0,-6]],[1.0,[0,0,-3]],[1.5,[0,0,0]],[3.0,[0,0,0]]],
 // 手首の位置（空中）：胸の座標。[左右, 高さ(胸の上端からの量), 前]
 armR:[[0,[.24,.58,.06]],[.42,[.24,.58,.12]],[.55,[.24,.56,.16]],[1.5,[.24,.56,.10]],[1.75,[.30,.45,.05]],[1.98,[.68,.02,.02]],[2.15,[.68,.02,.02]],[2.55,[.60,.34,.02]],[3.2,[.60,.34,.02]]],
 armL:[[0,[.24,.58,.06]],[.42,[.24,.58,.12]],[.55,[.24,.56,.16]],[1.0,[.24,.56,.10]],[1.12,[.24,.52,.10]],[1.35,[.24,.56,.10]],[1.70,[.30,.50,.08]],[2.0,[.68,.02,.02]],[2.15,[.68,.02,.02]],[2.55,[.60,.34,.02]],[3.2,[.60,.34,.02]]],
 // 脚の向き（空中）：骨盤の座標の方向 [左右(外が正), 上下, 前後]
 legR:[[0,[0,-1,0]],[.50,[0,-.9,-.4]],[.62,[.15,-.45,-.88]],[.82,[.55,-.78,-.3]],[1.0,[.78,-.62,0]],[1.36,[.62,-.78,0]],[3.2,[.3,-.95,0]]],
 legL:[[0,[0,-1,0]],[.70,[.25,-.95,.15]],[.85,[.55,-.8,.1]],[1.0,[.78,-.62,0]],[1.40,[.75,-.66,0]],[1.75,[.62,-.78,0]],[1.95,[.42,-.9,0]],[3.2,[.3,-.95,0]]],
};
// 床につく点と期間 [つく, 離れる]（体重がかかる手・足）
const CON={
 footR:{p:v3(0,0,.09),  on:[[-1,.58],[1.36,9]], p2:v3(2.08,0,0)},
 footL:{p:v3(0,0,-.09), on:[[-1,.28],[.50,.62],[1.98,9]], pm:v3(.62,0,-.03), p2:v3(2.58,0,0)},
 handL:{p:v3(1.12,0,-0.10), on:[[.64,1.12]]},
 handR:{p:v3(1.52,0,0), on:[[.82,1.75]]},
};
function conPos(c,i){ return i===0?c.p:(c.pm&&i===1?c.pm:(c.p2||c.p)); }
function contact(c,t){ // 重み0〜1と、その位置。つく直前は減速しながら近づき、離れる時はゆっくり離れる
  const n=c.on.length;
  for(let i=0;i<n;i++){const [a,b]=c.on[i];
    const prevB=i>0?c.on[i-1][1]:-9, nextA=i<n-1?c.on[i+1][0]:99;
    const A=Math.min(0.2,(a-prevB)/2), R=Math.min(0.2,(nextA-b)/2);
    if(t>=a&&t<=b) return [1,conPos(c,i)];
    if(t>a-A&&t<a){const u=(t-(a-A))/A; return [u*u*(3-2*u),conPos(c,i)];}
    if(t>b&&t<b+R){const u=1-(t-b)/R; return [u*u*(3-2*u),conPos(c,i)];}
  }
  return [0,null];
}
const DUR=3.2;
const PHASES=[
 {t:0.00,name:'構え',tip:'正面を向き、両耳の横にひじが来るように腕を上げて伸ばす。'},
 {t:0.30,name:'踏み込む',tip:'踏み込む方の足（ここでは左足）をまっすぐ前に出す。後ろの脚を強く上に振り上げると、勢いがついて回りやすい。'},
 {t:0.60,name:'手をつく',tip:'出した足と同じ方の手→もう片方の手の順に、踏み込んだ足の先の1本の直線上につく（左足なら左手→右手）。目線は手をつく所。'},
 {t:0.95,name:'逆さま',tip:'ひざを伸ばし、両脚を大きく開く。逆さまのときもバランスがとりやすくなる。'},
 {t:1.30,name:'着地',tip:'先に右足が着地。後からついた方の手はまだマットを押したまま、回転に力を加える。両足で同時に着地しようとしない。'},
 {t:1.75,name:'起き上がる',tip:'後の手が離れたら、両腕は横に伸ばしたまま体と一緒に起こす。腕だけを先に振り戻さない。'},
 {t:2.30,name:'立つ',tip:'立ち上がりは横向き。両足を開いて、腕は斜め上に開く。'},
];
function track(keys,t){
  let i=0; while(i<keys.length-2&&t>=keys[i+1][0]) i++;
  const k0=keys[Math.max(0,i-1)],k1=keys[i],k2=keys[i+1],k3=keys[Math.min(keys.length-1,i+2)];
  const dt=k2[0]-k1[0], u=Math.min(1,Math.max(0,(t-k1[0])/dt)), u2=u*u,u3=u2*u;
  const dm=(k1[0]-k0[0])||dt, dp=(k3[0]-k2[0])||dt;
  return k1[1].map((_,n)=>{
    const m1=(k2[1][n]-k0[1][n])/(dt+dm)*dt*0.9, m2=(k3[1][n]-k1[1][n])/(dt+dp)*dt*0.9;
    return (2*u3-3*u2+1)*k1[1][n]+(u3-2*u2+u)*m1+(-2*u3+3*u2)*k2[1][n]+(u3-u2)*m2;});
}
const SM={}; const SMHZ=120;
function smoothTrack(name){
  const keys=TR[name], N=Math.ceil(DUR*SMHZ)+1, raw=[];
  for(let i=0;i<N;i++) raw.push(track(keys,i/SMHZ));
  const sig=5, K=[]; for(let k=-15;k<=15;k++) K.push(Math.exp(-k*k/(2*sig*sig)));
  const out=raw.map((_,i)=>{const acc=raw[0].map(()=>0); let ws=0;
    K.forEach((w,j)=>{const ii=Math.min(N-1,Math.max(0,i+j-15)); raw[ii].forEach((v,n)=>acc[n]+=v*w); ws+=w;});
    return acc.map(v=>v/ws);});
  SM[name]=out;
}
Object.keys(TR).forEach(smoothTrack);
function trk(name,t){const a=SM[name], x=Math.min(a.length-1.001,Math.max(0,t*SMHZ)), i=Math.floor(x), f=x-i;
  return a[i].map((v,n)=>v+(a[i+1][n]-v)*f);}
const HAND_DOWN={R:quatFrom(v3(0,0,1),v3(0,-1,0)),L:quatFrom(v3(0,0,1),v3(0,-1,0))}; // 手のひらを床に、指はカメラ側
function fingerSet(sd,flat){ // flat=1で床にぴったり開く
  const curl=(1-flat)*15*D, spread=(8+flat*8)*D;
  fingers[sd].forEach(f=>{f.base.rotation.set(-curl,0,f.spread*spread*0.6); f.j2.rotation.set(-curl*1.1,0,0);});
  const T=fingers[sd].thumb; T.tb.rotation.set(-0.3*(1-flat),0,T.sx*(30+flat*30)*D); T.tj.rotation.set(-curl*0.6,0,0);
}
const qBody=new THREE.Quaternion(); const AIM=0.85; let ARM=L1+L2;
function resetGirdle(){['R','L'].forEach(sd=>{J_['cl'+sd].rotation.set(0,0,0);J_['fr'+sd].quaternion.set(0,0,0,1);});}
function bodyPose(t,raw){
  resetGirdle();
  const [px,py,pz]=trk('pel',t), [yaw,pitch,roll]=trk('ori',t), [bs,bc,bn]=trk('bend',t);
  // 体全体の向き：側転の回転(z) × 向き(y) × 前傾(x)
  qBody.setFromAxisAngle(v3(0,0,1),roll*D).multiply(new THREE.Quaternion().setFromAxisAngle(v3(0,1,0),yaw*D))
       .multiply(new THREE.Quaternion().setFromAxisAngle(v3(1,0,0),pitch*D));
  // 手をついている間は、胴の軸（骨盤→頭）を手の方へ向ける（腕が顔の前を横切らないように）
  const [wl,cl]=contact(CON.handL,t), [wr,cr]=contact(CON.handR,t);
  if(wl+wr>0.001){
    const P=v3(0,0,0); if(wl>0)P.add(cl.clone().multiplyScalar(wl)); if(wr>0)P.add(cr.clone().multiplyScalar(wr)); P.multiplyScalar(1/(wl+wr));
    const want=P.sub(v3(px,py,pz)); want.z=0; want.normalize();
    const fade=t<1.1?1:Math.max(0.35,1-(t-1.1)/0.3*0.65); // 着地の側では弱める
    const up=v3(0,1,0).applyQuaternion(qBody), aim=Math.max(wl,wr)*AIM*fade;

  }
  // 骨盤は胴ほど回さない：踏み込みで手を伸ばす間は、骨盤を立てたまま腰と背中で前へ曲げる（股関節の可動域を超えないように）
  const kp=trk('pelK',t)[0];

  body.quaternion.copy(qPel);
  body.position.set(px,py,pz).sub(v3(0,hipY,0).applyQuaternion(qPel));

  let totAng=0; const basePos=body.position.clone();
  if(raw && wl+wr>0.001){
    J_.pelvis.rotation.set(0,0,0); J_.spine2.quaternion.copy(qHalf);
    J_.spine.quaternion.copy(qHalf).multiply(new THREE.Quaternion().setFromAxisAngle(v3(1,0,0),bs*D));
    J_.chest.quaternion.copy(qHalf).multiply(new THREE.Quaternion().setFromAxisAngle(v3(1,0,0),bc*D));
    for(let it=0;it<6;it++){
      fig.root.updateMatrixWorld(true);
      // 各肩の「あるべき位置」（手から腕の長さの所）を求め、体を平面内で回して動かして近づける
      const src=[],dst=[],wt=[];
      [['L',wl,cl],['R',wr,cr]].forEach(([sd,w,cp])=>{ if(w<=0) return;
        const Hh=v3(cp.x,FLOOR+0.075,cp.z);
        MQ.armIK(sd,Hh,v3((sd==='R'?-1:1),0,-0.3));   // 鎖骨の連動を含めた肩の位置で測る
        const S=new THREE.Vector3(); J_['sh'+sd].getWorldPosition(S);
        const d=S.clone().sub(Hh);
        const goal=Hh.clone().add(d.normalize().multiplyScalar(ARM*0.997));
        src.push(S); dst.push(S.clone().lerp(goal,w)); wt.push(w); });
      const W=wt.reduce((x,y)=>x+y,0), cs=v3(0,0,0), cd=v3(0,0,0);
      src.forEach((v,i)=>cs.add(v.clone().multiplyScalar(wt[i]/W))); dst.forEach((v,i)=>cd.add(v.clone().multiplyScalar(wt[i]/W)));
      let ang=0;
      if(src.length===2){ // 画面の面（xy）内の回転
        const a1=src[1].clone().sub(src[0]), a2=dst[1].clone().sub(dst[0]);
        ang=(Math.atan2(a2.y,a2.x)-Math.atan2(a1.y,a1.x)); ang=Math.atan2(Math.sin(ang),Math.cos(ang))*Math.min(1,wt[0],wt[1]); }
      const qz=new THREE.Quaternion().setFromAxisAngle(v3(0,0,1),ang);
      body.position.sub(cs).applyQuaternion(qz).add(cd);
      body.quaternion.premultiply(qz); totAng+=ang;
    }
  }
  if(raw) RAWC=[body.position.x-basePos.x, body.position.y-basePos.y, totAng];
  else if(CORR){ const c=corrAt(t); body.quaternion.copy(new THREE.Quaternion().setFromAxisAngle(v3(0,0,1),c[2]).multiply(qPel));
    // 回転は骨盤まわり、移動はならした量
    body.position.set(px,py,pz).sub(v3(0,hipY,0).applyQuaternion(body.quaternion)).add(v3(c[0],c[1],0)); }
  J_.pelvis.rotation.set(0,0,0); J_.spine2.quaternion.copy(qHalf);
  J_.spine.quaternion.copy(qHalf).multiply(new THREE.Quaternion().setFromAxisAngle(v3(1,0,0),bs*D));
  J_.chest.quaternion.copy(qHalf).multiply(new THREE.Quaternion().setFromAxisAngle(v3(1,0,0),bc*D));
  J_.neck.rotation.set(bn*D,0,0); J_.head.rotation.set(0,0,0);
  fig.root.updateMatrixWorld(true);
  return px;
}
// 手足の目標点（世界の座標）を全時間ぶん先に計算し、なめらかにならしてから使う
const LIMBS=[
 {sd:'L',sx:1,kind:'leg',tk:'legL',cn:CON.footL},{sd:'R',sx:-1,kind:'leg',tk:'legR',cn:CON.footR},
 {sd:'L',sx:1,kind:'arm',tk:'armL',cn:CON.handL},{sd:'R',sx:-1,kind:'arm',tk:'armR',cn:CON.handR}];
const legLen=(T1+T2)*0.985;
const TGT=LIMBS.map(()=>[]);
let CORR=null, RAWC=null;
(function precomputeCorr(){ // 腕を伸ばすための体の補正量を全時間ぶん求めてならす
  const N=Math.ceil(DUR*SMHZ)+1, raw=[];
  for(let i=0;i<N;i++){ RAWC=[0,0,0]; bodyPose(i/SMHZ,true);
    // 補正後の骨盤の位置を基準の式で表し直す（骨盤まわりの回転＋移動）
    const pp=new THREE.Vector3(); J_.pelvis.getWorldPosition(pp); const [px,py,pz]=trk('pel',i/SMHZ);
    raw.push([pp.x-px, pp.y-py, RAWC[2]]); }
  const sig=3,K=[];for(let j=-9;j<=9;j++)K.push(Math.exp(-j*j/(2*sig*sig)));
  CORR=raw.map((_,i)=>{const acc=[0,0,0];let ws=0;K.forEach((w,j)=>{const ii=Math.min(N-1,Math.max(0,i+j-9));for(let n=0;n<3;n++)acc[n]+=raw[ii][n]*w;ws+=w;});return acc.map(v=>v/ws);});
})();
function corrAt(t){const a=CORR, x=Math.min(a.length-1.001,Math.max(0,t*SMHZ)), i=Math.floor(x), f=x-i; return a[i].map((v,n)=>v+(a[i+1][n]-v)*f);}
(function precompute(){
  const N=Math.ceil(DUR*SMHZ)+1;
  for(let i=0;i<N;i++){ const t=i/SMHZ; bodyPose(t);
    LIMBS.forEach((L,k)=>{
      let free;
      if(L.kind==='leg'){const d=trk(L.tk,t); free=J_.pelvis.localToWorld(J_['hp'+L.sd].position.clone().add(v3(L.sx*d[0],d[1],d[2]).normalize().multiplyScalar(legLen)));}
      else {const a=trk(L.tk,t); free=J_.chest.localToWorld(v3(L.sx*a[0],chestTop+a[1],a[2]));}
      TGT[k].push([free.x,free.y,free.z]);
    });
  }
  // 空中の軌道だけをならす（床の点は固定のまま、あとで重みで混ぜる）
  const sig=8,K=[];for(let j=-24;j<=24;j++)K.push(Math.exp(-j*j/(2*sig*sig)));
  TGT.forEach(arr=>{const raw=arr.map(r=>r.slice());
    arr.forEach((r,i)=>{const acc=[0,0,0];let ws=0;K.forEach((w,j)=>{const ii=Math.min(N-1,Math.max(0,i+j-24));for(let n=0;n<3;n++)acc[n]+=raw[ii][n]*w;ws+=w;});
      for(let n=0;n<3;n++) r[n]=acc[n]/ws; });
  });
})();
function tgtAt(k,t){const a=TGT[k], x=Math.min(a.length-1.001,Math.max(0,t*SMHZ)), i=Math.floor(x), f=x-i;
  const L=LIMBS[k]; const p=v3(...a[i].map((v,n)=>v+(a[i+1][n]-v)*f));
  const [w,cp]=contact(L.cn,t);
  if(w>0) p.lerp(v3(cp.x,FLOOR+(L.kind==='leg'?ankleH:0.075),cp.z),w);
  return [p.x,p.y,p.z,w];}
let headMesh=MQ.headMesh;
let GAZE=null;
function setPose(t){
  const px=bodyPose(t);
  LIMBS.forEach((L,k)=>{
    const [x,y,z,w]=tgtAt(k,t), sd=L.sd, sx=L.sx;
    if(L.kind==='leg'){
      // ひざの向き：空中では骨盤の前方。床に足がついている間は、つま先の水平の向き（やや上）へ
      let pole=v3(sx*0.1,0,1);
      if(w>0.001){const fh=v3(0,0,1).applyAxisAngle(v3(0,1,0),trk('ori',t)[0]*D); fh.y=0.25; fh.normalize();
        const pl=fh.transformDirection(new THREE.Matrix4().copy(J_.pelvis.matrixWorld).invert());
        pole=pole.clone().lerp(pl,w).normalize();}
      solve2(J_['hp'+sd],J_['kn'+sd],J_.pelvis.worldToLocal(v3(x,y,z)),pole,T1,T2,1);
      fig.root.updateMatrixWorld(true);
      J_['an'+sd].quaternion.set(0,0,0,1);
      if(w>0.001){const pf=v3(0,0,1).transformDirection(J_.pelvis.matrixWorld); pf.y=0; if(pf.lengthSq()<1e-4)pf.set(0,0,1); pf.normalize();
        const qf=new THREE.Quaternion().setFromUnitVectors(v3(0,0,1),pf); // 足先は骨盤の向きへ回る
        const fq=new THREE.Quaternion(); J_['an'+sd].getWorldQuaternion(fq); setWorldQuat(J_['an'+sd],fq.slerp(qf,w));}
      MQ.toeFlat(sd,w);
    } else {
      const tgt=v3(x,y,z);
      MQ.armIK(sd,tgt,v3(sx*1,0,-0.3)); // 鎖骨（肩の付け根）の連動を含む
      fig.root.updateMatrixWorld(true);
      J_['wr'+sd].quaternion.set(0,0,0,1);
      if(w>0.001){const fq=new THREE.Quaternion(); J_['wr'+sd].getWorldQuaternion(fq); setWorldQuat(J_['wr'+sd],fq.slerp(HAND_DOWN[sd],w));}
      MQ.distributeTwist(sd);
      fingerSet(sd,w);
    }
  });
  fig.root.updateMatrixWorld(true);
  // 目線（調べた指導の要点）：構えは前、踏み込みから着地までは両手の間の床、起き上がると前へ戻す。頭は動かしすぎず、残りは目で見る
  {const kk=[[0,0],[.30,0],[.55,1],[1.55,1],[2.05,0],[3.2,0]]; let w=0; for(let i=0;i<kk.length-1;i++){if(t>=kk[i][0]&&t<=kk[i+1][0]){let u=(t-kk[i][0])/(kk[i+1][0]-kk[i][0]);u=u*u*(3-2*u);w=kk[i][1]+(kk[i+1][1]-kk[i][1])*u;break;}}
   const pe=new THREE.Vector3(); J_.head.getWorldPosition(pe); const pf=v3(0,0,1).transformDirection(J_.pelvis.matrixWorld); pf.y=0; if(pf.lengthSq()<1e-4)pf.set(1,0,0); pf.normalize();
   const fwdPt=pe.clone().add(pf.multiplyScalar(4)); fwdPt.y=pe.y; const handPt=v3((CON.handL.p.x+CON.handR.p.x)/2,FLOOR,(CON.handL.p.z+CON.handR.p.z)/2);
   GAZE=fwdPt.lerp(handPt,w); MQ.aimHead(GAZE,0.45); }
  bodyShadow.position.set(px,FLOOR+0.002,0.06);
}
// 再生の時間配分：倒立〜左足を下ろすまで（内部の0.85〜2.05秒）を約1.35倍速で進める。速さの変わり目はなめらかに
const WARP=(function(){const dt=1/240, A=0.35, a=0.85, b=2.05, r=0.15; const tbl=[[0,0]]; let ti=0, td=0;
  const sm=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
  while(ti<DUR){const sp=1+A*sm((ti-(a-r))/r)*(1-sm((ti-b)/r)); ti+=dt*sp; td+=dt; tbl.push([td,Math.min(ti,DUR)]);}
  return tbl;})();
const DUR_S=WARP[WARP.length-1][0];
function toInner(td){const i=Math.min(WARP.length-2,Math.max(0,Math.floor(td*240))); const [d0,i0]=WARP[i],[d1,i1]=WARP[i+1]; return i0+(i1-i0)*Math.min(1,Math.max(0,(td-d0)/(d1-d0)));}
function toShown(ti){let lo=0,hi=WARP.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(WARP[m][1]<ti)lo=m;else hi=m;}return WARP[hi][0];}
function frameAt(t){ setPose(toInner(t)); }

// 再生
let t=0, playing=false, speed=0.5, last=0, dirty=true;
const seek=document.getElementById('seek'), playB=document.getElementById('play');
const phName=document.getElementById('phName'), phTip=document.getElementById('phTip');
function phaseIndex(t){const ti=toInner(t);let i=0;while(i<PHASES.length-1&&ti>=PHASES[i+1].t-0.005)i++;return i;}
let shown=-1;
function setT(nt){t=Math.max(0,Math.min(DUR_S,nt));frameAt(t);seek.value=Math.round(t/DUR_S*1000);
  const i=phaseIndex(t); if(i!==shown){shown=i;phName.textContent=PHASES[i].name;phTip.textContent=PHASES[i].tip;
    [...phaseRow.querySelectorAll('button')].forEach((b,k)=>b.setAttribute('aria-pressed',String(k===i)));}
  dirty=true;}
function setPlaying(p){playing=p;playB.textContent=p?'❚❚ 止める':'▶ 再生';if(p&&t>=DUR_S)setT(0);last=performance.now();}
playB.onclick=()=>setPlaying(!playing);
seek.oninput=()=>{setPlaying(false);setT(seek.value/1000*DUR_S);};
const speedRow=document.getElementById('speeds');
[[0.15,'とてもゆっくり'],[0.5,'ゆっくり'],[1,'実際の速さ'],[2,'はやく']].forEach(([v,n])=>{const b=document.createElement('button');b.textContent=n;b.id='sp'+v;
  b.setAttribute('aria-pressed',String(v===speed));b.onclick=()=>{speed=v;[...speedRow.querySelectorAll('button')].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};speedRow.appendChild(b);});
const phaseRow=document.getElementById('phases');
PHASES.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.name;b.id='ph'+i;b.onclick=()=>{setPlaying(false);setT(toShown(p.t)+0.001);};phaseRow.appendChild(b);});

let az=0, el=0.12;
const viewRow=document.getElementById('views');
[['手本と同じ向き',0,0.12],['進む方向から',Math.PI/2,0.1],['ななめ',0.6,0.25],['うしろ',Math.PI,0.15],['上から',0.01,1.35]].forEach(([n,a,e])=>{
  const b=document.createElement('button');b.textContent=n;b.onclick=()=>{az=a;el=e;dirty=true;};viewRow.appendChild(b);});
const skinRow=document.getElementById('skins');
[['doll','なめらか'],['wire','針金（透けて奥が見える）']].forEach(([k,n],i)=>{const b=document.createElement('button');b.textContent=n;b.id='skin-'+k;
  b.setAttribute('aria-pressed',String(i===0));b.onclick=()=>{MQ.setSkin(k);[...skinRow.querySelectorAll('button')].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));dirty=true;};skinRow.appendChild(b);});
let zoom=1;
function setZoom(z){zoom=Math.max(0.25,Math.min(2.5,z));dirty=true;}
const zoomRow=document.getElementById('zooms');
[['＋ 大きく',1/1.4],['− 小さく',1.4],['もとの大きさ',0]].forEach(([n,f])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>setZoom(f?zoom*f:1);zoomRow.appendChild(b);});
stage.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*Math.exp(e.deltaY*0.001));},{passive:false});
const pts=new Map(); let pinch0=0, zoom0=1;
let drag=null;
stage.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});stage.setPointerCapture(e.pointerId);
  if(pts.size===2){const [a,b]=[...pts.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);zoom0=zoom;drag=null;} else drag={x:e.clientX,y:e.clientY};});
stage.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2&&pinch0){const [a,b]=[...pts.values()];setZoom(zoom0*pinch0/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)));}});
stage.addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-drag.x)*0.01;el=Math.max(-0.1,Math.min(1.3,el+(e.clientY-drag.y)*0.006));drag={x:e.clientX,y:e.clientY};dirty=true;});
['pointerup','pointercancel'].forEach(ev=>stage.addEventListener(ev,e=>{pts.delete(e.pointerId);if(pts.size<2)pinch0=0;drag=null;}));

let W=0,Hh=0;
function resize(){W=stage.clientWidth;Hh=stage.clientHeight;renderer.setSize(W,Hh,false);dirty=true;}
new ResizeObserver(resize).observe(stage);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>dirty=true);
const fpCam=new THREE.PerspectiveCamera(70,1,0.03,60); let fpMode='small';
const fpRow=document.getElementById('fpv');
[['small','小窓で見る'],['large','大きく見る'],['off','見ない']].forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.id='fp-'+k;
  b.setAttribute('aria-pressed',String(k===fpMode));b.onclick=()=>{fpMode=k;[...fpRow.querySelectorAll('button')].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));dirty=true;};fpRow.appendChild(b);});
function renderViews(){ // 全体の様子と、本人の目線（小窓または大きく）
  renderer.setScissorTest(true);
  const bg=new THREE.Color(css('--stage'));
  const drawFP=(x,y,w,h)=>{fpCam.aspect=w/h; MQ.eyeCamera(fpCam,GAZE); MQ.showHead(false); renderer.setViewport(x,y,w,h); renderer.setScissor(x,y,w,h); renderer.setClearColor(bg); renderer.clear(); renderer.render(scene,fpCam); MQ.showHead(true);};
  if(fpMode==='large'){ drawFP(0,0,W,Hh); }
  else { renderer.setViewport(0,0,W,Hh); renderer.setScissor(0,0,W,Hh); renderer.setClearColor(bg); renderer.render(scene,cam);
    if(fpMode==='small'){ const w=Math.round(Math.min(W*0.38,320)), h=Math.round(w*0.66), x=W-w-8, y=8;
      renderer.setScissor(x-3,y-3,w+6,h+6); renderer.setClearColor(new THREE.Color('#ffffff')); renderer.clear(); drawFP(x,y,w,h); } }
  renderer.setScissorTest(false);
}
function frame(now){
  if(playing){const dt=(now-last)/1000;last=now;setT(t+dt*speed);if(t>=DUR_S)setPlaying(false);}
  if(dirty&&W){dirty=false;
    const dist=5.2*zoom; let cy=0.8, tz=0, tx=1.2;
    if(zoom<0.8){ // 近づくと、注目点を体の中心に合わせて追いかける
      const pp=new THREE.Vector3(); J_.pelvis.getWorldPosition(pp); const k=Math.min(1,(0.8-zoom)/0.4);
      tx=tx+(pp.x-tx)*k; cy=cy+(pp.y-cy)*k; }
    cam.aspect=W/Hh;cam.position.set(tx+Math.sin(az)*Math.cos(el)*dist,cy+Math.sin(el)*dist,tz+Math.cos(az)*Math.cos(el)*dist);
    cam.lookAt(tx,cy,tz);cam.updateProjectionMatrix();
    renderer.setClearColor(new THREE.Color(css('--stage')));renderViews();}
  requestAnimationFrame(frame);
}
// 検証用（tools/verify/check.js が使う）
window.__motion={rom:MQ.ROM,DUR,setPose:t=>setPose(t),J:J_,headMesh,armLen:L1+L2,legLen:T1+T2,
  contacts:[['handL','wrL','shL',0.075],['handR','wrR','shR',0.075],['footL','anL','hpL',null],['footR','anR','hpR',null]].map(([c,j,s,h])=>({name:c,joint:j,root:s,
    reach:c[0]==='h'?L1+L2:T1+T2, at:t=>{const [w,cp]=contact(CON[c],t);return w>0?{w,x:cp.x,y:FLOOR+(h===null?ankleH:h),z:cp.z}:null;}})),
  support:t=>['L','R'].filter(sd=>contact(CON['hand'+sd],t)[0]>=0.999)};
resize(); setT(0); requestAnimationFrame(frame);
})();

</script>
