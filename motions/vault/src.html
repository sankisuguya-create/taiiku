  for(let pass=0;pass<4;pass++){ ROLL=cur; TGT=LIMBS.map(()=>[]); precompute(); const pe=[];

}
function rollAt(t){const x=Math.min(ROLL.length-1.001,Math.max(0,t*SMHZ)),i=Math.floor(x),f=x-i;return [ROLL[i][0]+(ROLL[i+1][0]-ROLL[i][0])*f,ROLL[i][1]+(ROLL[i+1][1]-ROLL[i][1])*f];}

function contactMax(t){ let m=0; Object.values(CON).forEach(c=>{c.on.forEach(([a,b])=>{if(t>=a&&t<=b)m=1;});}); /* 実際についている区間だけ（近づく途中は空中） */ if(TECH.headOn){const [a,b]=TECH.headOn; if(t>=a-0.08&&t<=b+0.08) m=1;} return m; }
function precomputeFlight(){ // 空中の区間ごとに、両端の重心を結ぶ放物線との差を求める
  FLIGHT=null; const N=Math.ceil(DUR*SMHZ)+1, G=9.8, C=[], W=[];

  const off=new Array(N).fill(0).map(()=>[0,0]);
  let i=0; while(i<N){ if(W[i]>0.999){i++;continue;} let a=i; while(i<N&&W[i]<=0.999) i++; let b=Math.min(N-1,i);
    if(a===0||b===N-1||b-a<3) continue; // 始めと終わりにつながる区間（立っている所）は除く

function flightAt(t){const a=FLIGHT,x=Math.min(a.length-1.001,Math.max(0,t*SMHZ)),i=Math.floor(x),f=x-i;return [a[i][0]+(a[i+1][0]-a[i][0])*f,a[i][1]+(a[i+1][1]-a[i][1])*f];}
function rebuild(key){ // 技を読み込み、先に計算する

  LIMBS=[{sd:'L',sx:1,kind:'leg',tk:'legL',cn:CON.footL},{sd:'R',sx:-1,kind:'leg',tk:'legR',cn:CON.footR},
         {sd:'L',sx:1,kind:'arm',tk:'armL',cn:CON.handL},{sd:'R',sx:-1,kind:'arm',tk:'armR',cn:CON.handR}];

}
function tgtAt(k,t){const a=TGT[k], x=Math.min(a.length-1.001,Math.max(0,t*SMHZ)), i=Math.floor(x), f=x-i;
  const L=LIMBS[k]; const p=v3(...a[i].map((v,n)=>v+(a[i+1][n]-v)*f));

var headMesh=MQ.headMesh;
var GAZE=null; const LEGPOLE={}; let KNEE_OUT=0;
function setPose(t){
  const px=bodyPose(t);

    const [x,y,z,w]=tgtAt(k,t), sd=L.sd, sx=L.sx;
    if(L.kind==='leg'){
      // ひざの向き：空中では骨盤の前方。床に足がついている間は、つま先の水平の向き（やや上）へ
      let pole=v3(sx*0.1,0,1);
      if(w>0.001){const fh=v3(0,0,1).applyAxisAngle(v3(0,1,0),trk('ori',t)[0]*D); fh.y=0.25; fh.normalize();
        const pl=fh.transformDirection(new THREE.Matrix4().copy(J_.pelvis.matrixWorld).invert());
        if(pl.dot(pole)<0.2) pl.add(pole.clone().multiplyScalar(0.5)); pole=pole.clone().lerp(pl.normalize(),w*w*w).normalize();} // 着く直前まではひざの向きを変えない（急に変えるとひざが反対へ跳ぶ）
      if(TECH.kneeIn) pole=pole.clone().add(v3(sx*KNEE_OUT,0,0)).normalize(); // 体育座りはひざをそろえる（いつも同じ量で、急に変えない）
      let fkDone=false;

        const q4=trk('legFK',t), hf=q4[0], kf=q4[1], ab=q4[2], er=q4.length>3?q4[3]:0; // er：脚を外へひねる角度（ひざ・つま先が外を向く）
        J_['hp'+sd].quaternion.setFromEuler(new THREE.Euler(-hf*D,-sx*er*D,sx*ab*D,'YXZ')); J_['kn'+sd].rotation.set(kf*D,0,0); fig.root.updateMatrixWorld(true);
        if(w<=0.001){ fkDone=true; }
        else { const A=J_.pelvis.worldToLocal(J_['an'+sd].getWorldPosition(new THREE.Vector3())), K=J_.pelvis.worldToLocal(J_['kn'+sd].getWorldPosition(new THREE.Vector3())), Hh=J_['hp'+sd].position.clone();
          const mid=Hh.clone().lerp(A,0.5); const pk=K.sub(mid); if(pk.lengthSq()>1e-6) pole=pk.normalize(); }

      if(TR.legFK&&(!TECH.fkWin||(t>=TECH.fkWin[0]&&t<=TECH.fkWin[1]))){ const A=J_.pelvis.worldToLocal(J_['an'+sd].getWorldPosition(new THREE.Vector3())); const [,cp]=contact(L.cn,t); const g=J_.pelvis.worldToLocal(v3(cp.x,cp.y+ankleH,cp.z)); lt=A.lerp(g,w); }
      solve2(J_['hp'+sd],J_['kn'+sd],lt,pole,T1,T2,1); fig.root.updateMatrixWorld(true);
      { // ひざが中心線に近づくほど、曲がる向きを連続的に外へ寄せる（急に切り替えるとひざが跳ねる）
        const kp=J_.pelvis.worldToLocal(J_['kn'+sd].getWorldPosition(new THREE.Vector3()));
        const k=TECH.sepOff?0:Math.min(1,Math.max(0,(0.05-kp.x*sx)/0.08))*(1-w); // 床についている足には使わない
        if(k>0){ pole=pole.clone().add(v3(sx*1.2*k,0,0)).normalize(); solve2(J_['hp'+sd],J_['kn'+sd],lt,pole,T1,T2,1); fig.root.updateMatrixWorld(true);} }
      }
      fig.root.updateMatrixWorld(true);
      J_['an'+sd].quaternion.set(0,0,0,1);
      if(w>0.001){const pf=v3(0,0,1).transformDirection(J_.pelvis.matrixWorld); pf.y=0; if(pf.lengthSq()<1e-4)pf.set(0,0,1); pf.normalize();
        const qf=new THREE.Quaternion().setFromUnitVectors(v3(0,0,1),pf); // 足先は骨盤の向きへ回る
        const fq=new THREE.Quaternion(); J_['an'+sd].getWorldQuaternion(fq); setWorldQuat(J_['an'+sd],fq.slerp(qf,w));}

      if(TECH.point){ const [p0,p1]=TECH.point; const r=0.08; let k=Math.min(1,(t-p0)/r,(p1-t)/r); k=Math.max(0,k); k=k*k*(3-2*k)*(1-w);

      if(TECH.flex){ const [p0,p1]=TECH.flex; const r=0.06; let k=Math.min(1,(t-p0)/r,(p1-t)/r); k=Math.max(0,k); k=k*k*(3-2*k)*(1-w);
        if(k>0){ J_['an'+sd].rotateX(-25*D*k); fig.root.updateMatrixWorld(true);} } // 跳び箱を越える間は足首を曲げてつま先を上げる（引っかけない）
    } else {

  {const kk=TECH.gaze; let w=0; for(let i=0;i<kk.length-1;i++){if(t>=kk[i][0]&&t<=kk[i+1][0]){let u=(t-kk[i][0])/(kk[i+1][0]-kk[i][0]);u=u*u*(3-2*u);w=kk[i][1]+(kk[i+1][1]-kk[i][1])*u;break;}}

  if(FLIGHT){ const q=flightAt(t); if(q[0]||q[1]){ body.position.x+=q[0]; body.position.y+=q[1]; fig.root.updateMatrixWorld(true);} }
