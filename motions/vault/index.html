<!-- 生成物：src.html と lib/ から tools/build.py で組み立て。直接直さない -->
<title>跳び箱の技</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* 配置：上に舞台、その下に「いまの局面とこつ」、再生バー、局面ボタン、視点ボタン */
:root{
  --bg:#eef3f6; --fg:#1d2a33; --muted:#5b6b76; --panel:#ffffff; --line:#d3dde4;
  --stage:#dfe8ee; --accent:#e0761c; --accent-fg:#ffffff;
  --right:#1f4b99; --left:#9cc8f0; --joint:#e0761c; --skin:#e9c7a2; --shirt:#fbfcfd; --ball:#d9662b;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141b20; --fg:#e6edf2; --muted:#9aabb6; --panel:#1d262d; --line:#2f3c46;
  --stage:#22303a; --accent:#f08a3a; --accent-fg:#141b20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141b20; --fg:#e6edf2; --muted:#9aabb6; --panel:#1d262d; --line:#2f3c46;
  --stage:#22303a; --accent:#f08a3a; --accent-fg:#141b20; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:1.25rem;margin:0}
.stage{position:relative;width:100%;aspect-ratio:16/10;max-height:58vh;border-radius:12px;overflow:hidden;background:var(--stage);touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.phase{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:4.2em}
.phase h2{margin:0 0 2px;font-size:1.15rem}
.phase p{margin:0;font-size:1rem;line-height:1.6}
.bar{display:flex;gap:8px;align-items:center}
.bar input[type=range]{flex:1;min-width:0;height:48px;accent-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.label{font-size:.8rem;color:var(--muted);width:100%;margin:0}
button{font:inherit;font-weight:700;min-height:48px;padding:0 16px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#play{min-width:96px}
.note{font-size:.78rem;color:var(--muted);margin:0;line-height:1.6}
</style>
<div class="wrap">
  <h1>跳び箱の技</h1>
  <div class="row" id="techs"><p class="label">技</p></div>
  <div class="stage" id="stage"></div>
  <div class="phase" aria-live="polite"><h2 id="phName">構え</h2><p id="phTip"></p></div>
  <div class="bar"><button id="play">▶ 再生</button><input type="range" id="seek" min="0" max="1000" value="0" aria-label="再生位置"></div>
  <div class="row" id="speeds"><p class="label">速さ</p></div>
  <div class="row" id="phases"><p class="label">局面へとぶ</p></div>
  <div class="row" id="zooms"><p class="label">大きさ（2本指でつまんでも変えられます）</p></div>
  <div class="row" id="skins"><p class="label">見た目</p></div>
  <div class="row" id="fpv"><p class="label">本人の目線（どんな景色が見えるか）</p></div>
  <div class="row" id="views"><p class="label">見る向き（指でドラッグしても回せます）</p></div>
  <p class="note">人形は人体寸法の実測比から作った中間案（約6頭身）。時間配分と姿勢は、手本動画（「とび箱 お手本 17技」）のコマから写したもの。作り方は接点駆動法（足は床と踏み切り板、手は跳び箱を条件にして体を計算）。こつは学習指導要領解説を引く県・市の資料による（かかえ込み跳び・台上前転の頭の着き方は一般的な指導の要点で、資料では未確認）。</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff,0x8899aa,0.75));
const sun=new THREE.DirectionalLight(0xffffff,0.6); sun.position.set(2,4,3); scene.add(sun);
const cam=new THREE.PerspectiveCamera(30,1.6,0.1,50);
const M=c=>new THREE.MeshLambertMaterial({color:c});
// ---- lib/mannequin.js ここから（tools/build.py が埋め込み。直す時は元のファイルを）
// 模擬人形の組み立て（共通部品）。docs/mannequin.md が仕様。
// 見た目は2種類を切り替える：'doll'（ドール型＝ボディくん型のなめらかな人体）／'wire'（針金型＝網目と断面の輪。透けて奥が見える）
// 関節：pelvis spine spine2 chest neck head / clR shR elR wrR（左も同じ）/ hpR knR anR（左も同じ）
//   spine＝腰椎、spine2＝下の胸椎、chest＝上の胸椎（3つで背中を反る・丸める）。clR/clL＝鎖骨（肩を引く・すくめる＝胸を張る）
// 前は +Z、人形の右は −X。腕・脚は下（−Y）へ伸びる。各ページは //@include で埋め込む（tools/build.py）。
function buildMannequin(THREE, css){
  const H=1.6, HEADS=6, GIRTH=1.1;
  // 体節の長さは身長比の実測値（Drillis & Contini）
  const R={chin:0.870,shoulder:0.818,hipJ:0.530,knee:0.285,ankle:0.039,upperArm:0.186,forearm:0.146,hand:0.108,hipJW:0.10,footL:0.152};
  // 周径から出した半径（身長比）。[位置t, 半径]。ふくらはぎ・太もも・上腕のふくらみを残す
  const PROF={upper:[[0,.030],[.35,.029],[.8,.023],[1,.021]], fore:[[0,.023],[.25,.024],[.8,.017],[1,.015]],
              thigh:[[0,.050],[.15,.052],[.6,.040],[1,.031]], shank:[[0,.031],[.3,.035],[.75,.022],[1,.019]]};
  const hh=H/HEADS, s=(H-hh)/(R.chin*H), L=v=>v*H*s, G=v=>v*H*s*GIRTH;
  const v3=(x,y,z)=>new THREE.Vector3(x,y,z);
  // 見た目（役割ごとの材質）
  const lam=c=>new THREE.MeshLambertMaterial({color:c});
  const lam2=c=>new THREE.MeshLambertMaterial({color:c,side:THREE.DoubleSide});
  const wir=c=>new THREE.MeshBasicMaterial({color:c,wireframe:true,transparent:true,opacity:0.85});
  const solid=c=>new THREE.MeshBasicMaterial({color:c});
  const SKIN={
    doll:{R:lam('#4f6f9a'),L:lam('#dce5ee'),T:lam('#c9d1da'),S:lam('#d4dbe2'),J:lam('#aeb8c3'),A:lam('#4a545e'),O:lam(css('--joint')||'#e0761c'),
          BR:lam('#243f66'),BL:lam('#8fa6bf'),BS:lam('#8e9aa7'),G:lam('#7d8894'),P:lam('#e8c4a0')},   // P＝手のひらと指（肌色）   // B*＝腕の裏側（二の腕の後ろ・前腕と手の甲側）
    wire:{R:wir('#1f4b99'),L:wir('#5fa8e6'),T:wir('#55636e'),S:wir('#55636e'),J:solid('#e0761c'),A:solid('#22303a'),O:solid('#e0761c'),BR:wir('#1f4b99'),BL:wir('#5fa8e6'),BS:wir('#55636e'),G:solid('#7d8894'),P:wir('#55636e')},
  };
  const root=new THREE.Group(), body=new THREE.Group(); root.add(body);
  const J_={}, allMeshes=[];
  const J=(p,name,x,y,z)=>{const g=new THREE.Group();g.position.set(x,y,z);p.add(g);if(name)J_[name]=g;return g;};
  const mesh=(geo,role,p,x,y,z,opt)=>{const o=new THREE.Mesh(geo,SKIN.doll[role]);o.position.set(x||0,y||0,z||0);o.userData.role=role;
    if(opt)Object.assign(o.userData,opt);p.add(o);allMeshes.push(o);return o;};
  const ell=(p,rx,ry,rz,y,role,z)=>{const o=mesh(new THREE.SphereGeometry(1,20,14),role,p,0,y,z);o.scale.set(rx,ry,rz);return o;};
  const ring=(p,r,y,role)=>{const o=mesh(new THREE.TorusGeometry(r,0.0025,4,24),role,p,0,y,0,{wireOnly:true});o.rotation.x=Math.PI/2;return o;};
  const joint=(p,r)=>mesh(new THREE.SphereGeometry(r,14,10),'J',p);
  function limb(p,len,prof,role){
    const pts=prof.map(([t,r])=>[t,G(r)]);
    const v=[new THREE.Vector2(0,0)]; pts.forEach(([t,r])=>v.push(new THREE.Vector2(r,-t*len))); v.push(new THREE.Vector2(0,-len));
    v.reverse(); // 下から上の順にすると面が外を向く（逆だと内側が見えて透けて見える）
    mesh(new THREE.LatheGeometry(v,18),role,p);
    [.25,.5,.75].forEach(u=>{let r=pts[0][1];for(let i=1;i<pts.length;i++)if(pts[i][0]>=u){const [t0,a0]=pts[i-1],[t1,a1]=pts[i];r=a0+(a1-a0)*(u-t0)/(t1-t0);break;} ring(p,r,-u*len,role);});
  }
  function backHalf(p,len,prof,role){ // 体節の後ろ半分を、わずかに大きい半円の回転体で覆う
    const v=[]; prof.forEach(([t,r])=>v.push(new THREE.Vector2(G(r)*1.012,-t*len))); v.reverse();
    const g=new THREE.LatheGeometry(v,12,Math.PI/2,Math.PI);   // phi=π が −Z（後ろ）
    mesh(g,role,p,0,0,0,{dollOnly:true});
  }
  const DEP=0.68;
  function trunk(p,pts,role){ // pts: [y, 半幅(身長比)]。断面は前後に薄い楕円
    const v=[new THREE.Vector2(0,pts[0][0])]; pts.forEach(([y,r])=>v.push(new THREE.Vector2(G(r),y))); v.push(new THREE.Vector2(0,pts[pts.length-1][0]));
    const o=mesh(new THREE.LatheGeometry(v,20),role,p); o.scale.z=DEP; return o;
  }
  // ---- 骨格 ----
  const hipY=L(R.hipJ), shY=L(R.shoulder), spineLen=(shY-hipY)*0.38, chestH=shY-hipY-L(0.05)-spineLen;
  J(body,'pelvis',0,hipY,0);
  J(J_.pelvis,'spine',0,L(0.05),0);          // 腰椎
  J(J_.spine,'spine2',0,spineLen*0.5,0);     // 下の胸椎
  J(J_.spine2,'chest',0,spineLen*0.5,0);     // 上の胸椎
  const neckLen=L(R.chin-R.shoulder);
  J(J_.chest,'neck',0,chestH,0); J(J_.neck,'head',0,neckLen*0.8,0);
  // 胴（関節ごとに分け、重ねて継ぎ目を隠す。反る・丸めると背中がカーブする）
  trunk(J_.pelvis,[[-L(.06),.071],[-L(.03),.095],[L(.03),.092],[L(.06),.074]],'T');
  trunk(J_.spine,[[-spineLen*.05,.075],[spineLen*.3,.073],[spineLen*.58,.075]],'T');
  trunk(J_.spine2,[[-spineLen*.06,.075],[spineLen*.3,.078],[spineLen*.58,.083]],'T');
  trunk(J_.chest,[[-chestH*.05,.083],[chestH*.45,.097],[chestH*.85,.095],[chestH,.074],[chestH*1.08,.03]],'T');
  [J_.spine,J_.spine2].forEach(j=>joint(j,G(.018)));
  // 胸の印（前が分かる）：オレンジの円＋上向きの三角
  const frontZ=G(.097)*DEP*0.985;
  mesh(new THREE.CircleGeometry(G(.03),24),'O',J_.chest,0,chestH*0.55,frontZ);
  const tri=mesh(new THREE.CircleGeometry(G(.022),3),'O',J_.chest,0,chestH*0.8,frontZ*0.985); tri.rotation.z=Math.PI/2;
  // 背中の印：肩甲骨のマーク。背中の面に貼った絵（左肩甲骨＝後ろから見て「」」、右肩甲骨＝その左右反転。内側の縦線＋下の横線、灰色）
  // 胸の回転体と同じ形の薄い面（左右に分けて）に描く。腕を上げると絵が少し下がり、下の角が外へ回る（applyRhythm）
  const scap={};
  [['L',1],['R',-1]].forEach(([sd,sx])=>{ // sx=1：人形の左（+X）
    const c=document.createElement('canvas'); c.width=128; c.height=256; const x=c.getContext('2d');
    // u：左は外側→背骨、右は背骨→外側。縦線は背骨寄り、横線は下で外へ
    const uIn=sx>0?0.82:0.18, uOut=sx>0?0.30:0.70, vTop=0.80, vBot=0.30, lw=10;
    x.strokeStyle='#7d8894'; x.lineWidth=lw; x.lineCap='round'; x.beginPath();
    x.moveTo(uIn*128,(1-vTop)*256); x.lineTo(uIn*128,(1-vBot)*256); x.lineTo(uOut*128,(1-vBot)*256); x.stroke();
    const tex=new THREE.CanvasTexture(c); tex.center.set(uIn,vBot);
    const pts=[[chestH*.12,.0855],[chestH*.45,.097],[chestH*.78,.0955]].map(([y,r])=>new THREE.Vector2(G(r)*1.03,y));
    const phi0=sx>0?Math.PI/2+0.35:Math.PI, phiL=Math.PI/2-0.35;      // phi=π が背中の中央
    const patch=new THREE.Mesh(new THREE.LatheGeometry(pts,16,phi0,phiL),new THREE.MeshLambertMaterial({map:tex,transparent:true,depthWrite:false}));
    patch.scale.z=DEP; patch.userData.fixed=true; J_.chest.add(patch);   // 見た目の切り替えで材質を変えない
    scap[sd]=tex;
  });
  // 首・頭（鼻で向きを示す）
  mesh(new THREE.CylinderGeometry(G(.022),G(.026),neckLen,14),'S',J_.neck,0,neckLen/2);
  joint(J_.neck,G(.016));
  const headMesh=ell(J_.head,hh*0.37,hh*0.5,hh*0.43,hh*0.5,'S');
  const nose=mesh(new THREE.ConeGeometry(hh*0.045,hh*0.1,10),'S',J_.head,0,hh*0.45,hh*0.45); nose.rotation.x=Math.PI/2;
  [-1,1].forEach(x=>mesh(new THREE.SphereGeometry(hh*0.035,8,6),'A',J_.head,x*hh*0.14,hh*0.56,hh*0.39,{wireOnly:true}));
  // ---- 手足 ----
  const handC={}, palmC={}, fingers={R:[],L:[]};
  const fseg=(len,r)=>{const g=new THREE.Group();mesh(new THREE.CylinderGeometry(r,r*0.9,len,6),'P',g,0,-len/2);mesh(new THREE.SphereGeometry(r*0.9,6,4),'P',g,0,-len);return g;};
  [['R',-1],['L',1]].forEach(([k,sx])=>{
    const role=k;
    const shX=sx*(G(.095)+G(.012)), clX=sx*G(.02);
    const cl=J(J_.chest,'cl'+k,clX,chestH*0.9,0);                         // 鎖骨（胸の上端の内側を支点に）
    const sh=J(cl,'sh'+k,shX-clX,chestH*0.85-chestH*0.9,0); joint(sh,G(.03));
    limb(sh,L(R.upperArm),PROF.upper,role); backHalf(sh,L(R.upperArm),PROF.upper,'B'+k);
    const el=J(sh,'el'+k,0,-L(R.upperArm),0); joint(el,G(.024));
    const fr=J(el,'fr'+k,0,0,0);                                            // 前腕のひねり（手のひらを上・下に向ける回転）
    limb(fr,L(R.forearm),PROF.fore,role); backHalf(fr,L(R.forearm),PROF.fore,'B'+k);   // 前腕の裏（手の甲側）
    const wr=J(fr,'wr'+k,0,-L(R.forearm),0); joint(wr,G(.0105)); // 手首の球は小さく（手のひらを隠さない）
    // 手：手のひら＋指4本（各2節）＋親指（2節）
    const pl=0.058, pw=0.06, pt=0.02; // 手のひらを少し長く
    mesh(new THREE.BoxGeometry(pw,pl,pt),'P',wr,0,-pl/2);
    mesh(new THREE.BoxGeometry(pw*1.01,pl*1.01,pt*0.35),'BS',wr,0,-pl/2,-pt*0.35,{dollOnly:true});   // 手の甲
    { // 手のひらのしわの印：右手＝「て」、左手＝その左右反転（手のひら側から見て）。手のひらの面に貼った絵
      const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d');
      x.save(); if(k==='L'){x.translate(128,0);x.scale(-1,1);}
      x.fillStyle='#6f7b88'; x.font='bold 112px "Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('て',64,70); x.restore();
      const pm=new THREE.Mesh(new THREE.PlaneGeometry(pw*0.95,pl*0.95),new THREE.MeshLambertMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
      pm.position.set(0,-pl/2,pt/2+0.0015); pm.rotation.z=Math.PI; pm.userData.fixed=true; wr.add(pm); // 指先が下なので絵を180°回して、指を上にして見た時に正しい向き
    }
    [[.021,.030,.020,.0058],[.007,.033,.022,.006],[-.007,.031,.021,.0058],[-.021,.024,.017,.0052]].forEach(([x,l1,l2,r],i)=>{
      const base=new THREE.Group(); base.position.set(sx*x,-pl,0); wr.add(base);
      const p1=fseg(l1,r); base.add(p1);
      const j2=new THREE.Group(); j2.position.y=-l1; p1.add(j2); j2.add(fseg(l2,r*0.92));
      const tip=new THREE.Object3D(); tip.position.y=-l2*0.95; j2.add(tip);
      fingers[k].push({base,j2,tip,spread:(1.5-i)*sx});
    });
    const tb=new THREE.Group(); tb.position.set(sx*pw/2,-0.012,0.004); wr.add(tb);
    const t1=fseg(0.026,0.0075); tb.add(t1);
    const tj=new THREE.Group(); tj.position.y=-0.026; t1.add(tj); tj.add(fseg(0.022,0.0068));
    const ttip=new THREE.Object3D(); ttip.position.y=-0.022; tj.add(ttip);
    fingers[k].thumb={tb,tj,sx,tip:ttip};
    const c=new THREE.Object3D(); c.position.y=-0.06; wr.add(c); handC[k]=c;
    const pc=new THREE.Object3D(); pc.position.set(0,-0.03,pt/2); wr.add(pc); palmC[k]=pc;
    // 脚
    const hp=J(J_.pelvis,'hp'+k,sx*L(R.hipJW/2),0,0); joint(hp,G(.034));
    limb(hp,hipY-L(R.knee),PROF.thigh,role);
    const kn=J(hp,'kn'+k,0,-(hipY-L(R.knee)),0); joint(kn,G(.03));
    limb(kn,L(R.knee-R.ankle),PROF.shank,role);
    const an=J(kn,'an'+k,0,-L(R.knee-R.ankle),0); joint(an,G(.02));
    // 足：かかと側とつま先に分け、母指球の位置につま先の関節
    const fL=L(R.footL), ballZ=fL*0.55, fy=-L(R.ankle)*0.5;
    const heel=mesh(new THREE.BoxGeometry(1,1,1),role,an,0,fy,(-0.2*fL+ballZ)/2); heel.scale.set(G(.034),L(R.ankle),ballZ+0.2*fL);
    const to=J(an,'to'+k,0,-L(R.ankle),ballZ);                              // つま先（足の指の付け根）
    const toe=mesh(new THREE.BoxGeometry(1,1,1),role,to,0,L(R.ankle)*0.42,(0.8*fL-ballZ)/2); toe.scale.set(G(.033),L(R.ankle)*0.84,0.8*fL-ballZ);
    joint(to,G(.012)).position.y=L(R.ankle)*0.4;
  });
  // 指の部品にも役割を付ける（fsegで作った分）
  root.traverse(o=>{if(o.isMesh&&!o.userData.role&&!o.userData.fixed){o.userData.role='S';allMeshes.push(o);}});
  function setSkin(kind){
    const sk=SKIN[kind]||SKIN.doll;
    allMeshes.forEach(o=>{o.material=sk[o.userData.role]; o.visible=o.userData.wireOnly?kind==='wire':(o.userData.dollOnly?kind!=='wire':true);
      if(o.userData.role==='J'){ if(!o.userData.s0)o.userData.s0=o.scale.x; o.scale.setScalar(o.userData.s0*(kind==='wire'?0.55:1)); } }); // 針金では関節を小さな点に
  }
  setSkin('doll');
  const D=Math.PI/180;
  // 関節の可動域（度、関節の局所の回転 YXZ）。x:前後に曲げる y:ひねる z:横に曲げる。正の向きは docs/mannequin.md
  // 数値は一般的な可動域の参考値を、背骨は3つに分けた1つあたりに割った目安（根拠：一般値。個人差が大きい）
  const ROM={
    spine:{x:[-20,25],y:[-8,8],z:[-10,10]}, spine2:{x:[-12,18],y:[-12,12],z:[-10,10]}, chest:{x:[-12,15],y:[-15,15],z:[-10,10]},

  {const kk=TECH.gaze; let w=0; for(let i=0;i<kk.length-1;i++){if(t>=kk[i][0]&&t<=kk[i+1][0]){let u=(t-kk[i][0])/(kk[i+1][0]-kk[i][0]);u=u*u*(3-2*u);w=kk[i][1]+(kk[i+1][1]-kk[i][1])*u;break;}}
   if(t>kk[kk.length-1][0]) w=kk[kk.length-1][1];
   const pe=new THREE.Vector3(); J_.head.getWorldPosition(pe);
   const fwdPt=v3(pe.x+4,pe.y*0.8,0), handPt=v3(TECH.hand[2],BOX_H,0);
   if(TECH.tuckAfter&&t>TECH.tuckAfter) GAZE=null; else { GAZE=fwdPt.lerp(handPt,w); MQ.aimHead(GAZE,0.45); } }
  // 体の部品どうしの重なり：脚（太もも・すね）が同じ側の腕に重なったら、脚を内側へ寄せて解き直す（中心線は越えない）
  if(!TECH.sepOff) ['L','R'].forEach(sd=>{ const sx=sd==='R'?-1:1, wp=n=>J_[n].getWorldPosition(new THREE.Vector3());
    const segd=(a,b,c,d)=>{let m=9;for(let i=0;i<=6;i++){const p=a.clone().lerp(b,i/6);for(let j=0;j<=6;j++){m=Math.min(m,p.distanceTo(c.clone().lerp(d,j/6)));}}return m;};
    for(let it=0;it<5;it++){ const sh=wp('sh'+sd),el=wp('el'+sd),wr=wp('wr'+sd),hp=wp('hp'+sd),kn=wp('kn'+sd),an=wp('an'+sd);
      const pen=Math.max(0.035+0.05-segd(sh,el,hp,kn),0.028+0.05-segd(el,wr,hp,kn),0.028+0.038-segd(el,wr,kn,an),0.035+0.038-segd(sh,el,kn,an));
      if(pen<=0.002) break;
      const lt=J_.pelvis.worldToLocal(an.clone()); lt.x-=sx*(pen+0.01); lt.x=sx>0?Math.max(lt.x,0.03):Math.min(lt.x,-0.03);
      solve2(J_['hp'+sd],J_['kn'+sd],lt,LEGPOLE[sd]||v3(sx*0.1,0,1),T1,T2,1); fig.root.updateMatrixWorld(true); } });
  // 空中（手足がどこにもついていない間）は、体の重心が放物線（重力加速度 9.8m/s²、水平は等速）を通るように体全体をずらす
  if(FLIGHT){ const q=flightAt(t); if(q[0]||q[1]){ body.position.x+=q[0]; body.position.y+=q[1]; fig.root.updateMatrixWorld(true);} }
  bodyShadow.position.set(px,0.002,0.06);
}
rebuild('kaikyaku');
let DUR_S=DUR; const toInner=t=>t, toShown=t=>t;
function frameAt(t){ setPose(toInner(t)); }

// 再生
let t=0, playing=false, speed=0.5, last=0, dirty=true;
const seek=document.getElementById('seek'), playB=document.getElementById('play');
const phName=document.getElementById('phName'), phTip=document.getElementById('phTip');
function phaseIndex(t){const ti=toInner(t);let i=0;while(i<PHASES.length-1&&ti>=PHASES[i+1].t-0.005)i++;return i;}
let shown=-1;
function setT(nt){t=Math.max(0,Math.min(DUR_S,nt));frameAt(t);seek.value=Math.round(t/DUR_S*1000);
  const i=phaseIndex(t); if(i!==shown){shown=i;phName.textContent=PHASES[i].name;phTip.textContent=PHASES[i].tip;
    [...phaseRow.querySelectorAll('button')].forEach((b,k)=>b.setAttribute('aria-pressed',String(k===i)));}
  dirty=true;}
function setPlaying(p){playing=p;playB.textContent=p?'❚❚ 止める':'▶ 再生';if(p&&t>=DUR_S)setT(0);last=performance.now();}
playB.onclick=()=>setPlaying(!playing);
seek.oninput=()=>{setPlaying(false);setT(seek.value/1000*DUR_S);};
const speedRow=document.getElementById('speeds');
[[0.15,'とてもゆっくり'],[0.5,'ゆっくり'],[1,'実際の速さ'],[2,'はやく']].forEach(([v,n])=>{const b=document.createElement('button');b.textContent=n;b.id='sp'+v;
  b.setAttribute('aria-pressed',String(v===speed));b.onclick=()=>{speed=v;[...speedRow.querySelectorAll('button')].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};speedRow.appendChild(b);});
const phaseRow=document.getElementById('phases');
function buildPhases(){ [...phaseRow.querySelectorAll('button')].forEach(b=>b.remove());
  PHASES.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.name;b.id='ph'+i;b.onclick=()=>{setPlaying(false);setT(toShown(p.t)+0.001);};phaseRow.appendChild(b);}); shown=-1; }
buildPhases();
const techRow=document.getElementById('techs');
Object.entries(TECHS).forEach(([k,T],i)=>{const b=document.createElement('button');b.textContent=T.name;b.id='tech-'+k;b.setAttribute('aria-pressed',String(i===0));
  b.onclick=()=>{setPlaying(false); rebuild(k); DUR_S=DUR; window.__motion.DUR=DUR; buildPhases(); setT(0);
    [...techRow.querySelectorAll('button')].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};techRow.appendChild(b);});

let az=0, el=0.12;
const viewRow=document.getElementById('views');
[['手本と同じ向き（横から）',0,0.12],['ななめ前',1.0,0.2],['進む方向から',Math.PI/2,0.1],['反対の横から',Math.PI,0.12],['上から',0.01,1.35]].forEach(([n,a,e])=>{
  const b=document.createElement('button');b.textContent=n;b.onclick=()=>{az=a;el=e;dirty=true;};viewRow.appendChild(b);});
const skinRow=document.getElementById('skins');
[['doll','なめらか'],['wire','針金（透けて奥が見える）']].forEach(([k,n],i)=>{const b=document.createElement('button');b.textContent=n;b.id='skin-'+k;
  b.setAttribute('aria-pressed',String(i===0));b.onclick=()=>{MQ.setSkin(k);[...skinRow.querySelectorAll('button')].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));dirty=true;};skinRow.appendChild(b);});
let zoom=1;
function setZoom(z){zoom=Math.max(0.25,Math.min(2.5,z));dirty=true;}
const zoomRow=document.getElementById('zooms');
[['＋ 大きく',1/1.4],['− 小さく',1.4],['もとの大きさ',0]].forEach(([n,f])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>setZoom(f?zoom*f:1);zoomRow.appendChild(b);});
stage.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*Math.exp(e.deltaY*0.001));},{passive:false});
const pts=new Map(); let pinch0=0, zoom0=1;
let drag=null;
stage.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});stage.setPointerCapture(e.pointerId);
  if(pts.size===2){const [a,b]=[...pts.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);zoom0=zoom;drag=null;} else drag={x:e.clientX,y:e.clientY};});
stage.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2&&pinch0){const [a,b]=[...pts.values()];setZoom(zoom0*pinch0/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)));}});
stage.addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-drag.x)*0.01;el=Math.max(-0.1,Math.min(1.3,el+(e.clientY-drag.y)*0.006));drag={x:e.clientX,y:e.clientY};dirty=true;});
['pointerup','pointercancel'].forEach(ev=>stage.addEventListener(ev,e=>{pts.delete(e.pointerId);if(pts.size<2)pinch0=0;drag=null;}));

let W=0,Hh=0;
function resize(){W=stage.clientWidth;Hh=stage.clientHeight;renderer.setSize(W,Hh,false);dirty=true;}
new ResizeObserver(resize).observe(stage);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>dirty=true);
const fpCam=new THREE.PerspectiveCamera(70,1,0.03,60); let fpMode='small';
const fpRow=document.getElementById('fpv');
[['small','小窓で見る'],['large','大きく見る'],['off','見ない']].forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.id='fp-'+k;
  b.setAttribute('aria-pressed',String(k===fpMode));b.onclick=()=>{fpMode=k;[...fpRow.querySelectorAll('button')].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));dirty=true;};fpRow.appendChild(b);});
function renderViews(){ // 全体の様子と、本人の目線（小窓または大きく）
  renderer.setScissorTest(true);
  const bg=new THREE.Color(css('--stage'));
  const drawFP=(x,y,w,h)=>{fpCam.aspect=w/h; MQ.eyeCamera(fpCam,GAZE); MQ.showHead(false); renderer.setViewport(x,y,w,h); renderer.setScissor(x,y,w,h); renderer.setClearColor(bg); renderer.clear(); renderer.render(scene,fpCam); MQ.showHead(true);};
  if(fpMode==='large'){ drawFP(0,0,W,Hh); }
  else { renderer.setViewport(0,0,W,Hh); renderer.setScissor(0,0,W,Hh); renderer.setClearColor(bg); renderer.render(scene,cam);
    if(fpMode==='small'){ const w=Math.round(Math.min(W*0.38,320)), h=Math.round(w*0.66), x=W-w-8, y=8;
      renderer.setScissor(x-3,y-3,w+6,h+6); renderer.setClearColor(new THREE.Color('#ffffff')); renderer.clear(); drawFP(x,y,w,h); } }
  renderer.setScissorTest(false);
}
function frame(now){
  if(playing){const dt=(now-last)/1000;last=now;setT(t+dt*speed);if(t>=DUR_S)setPlaying(false);}
  if(dirty&&W){dirty=false;
    const dist=5.0*zoom; let cy=0.8, tz=0, tx=0.3;
    if(zoom<0.8){ // 近づくと、注目点を体の中心に合わせて追いかける
      const pp=new THREE.Vector3(); J_.pelvis.getWorldPosition(pp); const k=Math.min(1,(0.8-zoom)/0.4);
      tx=tx+(pp.x-tx)*k; cy=cy+(pp.y-cy)*k; }
    cam.aspect=W/Hh;cam.position.set(tx+Math.sin(az)*Math.cos(el)*dist,cy+Math.sin(el)*dist,tz+Math.cos(az)*Math.cos(el)*dist);
    cam.lookAt(tx,cy,tz);cam.updateProjectionMatrix();
    renderer.setClearColor(new THREE.Color(css('--stage')));renderViews();}
  requestAnimationFrame(frame);
}
// 検証用（tools/verify/check.js が使う）
window.__motion={rom:MQ.ROM,DUR,setPose:t=>setPose(t),J:J_,headMesh,armLen:L1+L2,legLen:T1+T2,
  contacts:[['handL','wrL','shL',0.075],['handR','wrR','shR',0.075],['footL','anL','hpL',null],['footR','anR','hpR',null]].map(([c,j,s,h])=>({name:c,joint:j,root:s,
    reach:c[0]==='h'?L1+L2:T1+T2, at:t=>{const [w,cp]=contact(CON[c],t);return w>0?{w,x:cp.x,y:cp.y+(h===null?ankleH:h),z:cp.z}:null;}})),
  support:t=>TECH.straightArms?['L','R'].filter(sd=>contact(CON['hand'+sd],t)[0]>=0.999):[], tech:k=>document.getElementById('tech-'+k).click()};
resize(); setT(0); requestAnimationFrame(frame);
})();
